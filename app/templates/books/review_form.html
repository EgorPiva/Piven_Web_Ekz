{% extends "base.html" %}

{% block title %}Рецензия на {{ book.title }}{% endblock %}

{% block head %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.css">
{% endblock %}

{% block content %}
<h1 class="h3 mb-4">Рецензия на книгу «{{ book.title }}»</h1>
<form method="post">
    <div class="mb-3">
        <label class="form-label" for="rating">Оценка</label>
        <select class="form-select" id="rating" name="rating" required>
            {% for value, label in rating_labels.items() %}
                <option value="{{ value }}" {{ 'selected' if form.get('rating') == value|string }}>{{ value }} - {{ label }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label" for="text">Текст рецензии</label>
        <textarea class="form-control js-markdown-editor" id="text" name="text" rows="8" required>{{ form.get('text', '') }}</textarea>
    </div>
    <div class="d-flex gap-2">
        <button class="btn btn-primary" type="submit">Сохранить</button>
        <a class="btn btn-outline-secondary" href="{{ url_for('books.show', book_id=book.id) }}">Отмена</a>
    </div>
</form>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.js"></script>
{% endblock %}
